<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Expenses</title>
  <meta name="description" content="Spese e budget personali">
  <meta name="theme-color" content="#f59e0b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
    <nav class="nav" aria-label="Navigazione">
      <div class="brand"><img src="icons/icon.svg" alt=""> <span>Expenses</span></div>
      <button data-view="home" class="active">
        <svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 4v4h6V4z"/></svg><span>Riepilogo</span></button>
      <button data-view="list">
        <svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg><span>Movimenti</span></button>
      <button data-view="budget">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v8l5 5"/></svg><span>Budget</span></button>
      <button data-view="loans">
        <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg><span>Prestiti</span><i id="loanBadge" hidden></i></button>
      <button data-view="savings">
        <svg viewBox="0 0 24 24"><path d="M5 11a7 6 0 0 1 13-2h1.5a1.5 1.5 0 0 1 0 3H19a7 6 0 0 1-3 4.5V19h-3v-1.6a8 8 0 0 1-2 0V19H8v-2.4A6 6 0 0 1 5 11z"/><path d="M10 7.5h4"/><circle cx="14.5" cy="10.5" r=".6"/></svg><span>Risparmi</span></button>
      <button data-view="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>Impostazioni</span><i id="syncDot" data-s="off" aria-hidden="true"></i></button>
    </nav>
    <main id="main"></main>
  </div>

  <button class="fab" id="fab" aria-label="Aggiungi spesa"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

  <dialog id="txDialog">
    <form id="txForm" method="dialog">
      <div class="dlg-head">
        <div class="seg" role="radiogroup">
          <button type="button" data-kind="expense" class="on">Uscita</button>
          <button type="button" data-kind="income">Entrata</button>
        </div>
        <button type="button" class="icon-btn" id="fCancel" aria-label="Chiudi">✕</button>
      </div>
      <label class="amount"><span>€</span><input id="fAmount" inputmode="decimal" placeholder="0,00" required autocomplete="off"></label>
      <div id="fRecent" class="recent"></div>
      <div id="fCats" class="cats"></div>
      <div class="row2">
        <label>Descrizione <input id="fName" placeholder="es. Esselunga" list="nameList" autocomplete="off"></label>
        <label>Data <input id="fDate" type="date" required></label>
      </div>
      <datalist id="nameList"></datalist>
      <label class="check" id="fRefundWrap"><input type="checkbox" id="fRefund"> È un rimborso (soldi che rientrano su questa categoria)</label>
      <div class="actions">
        <button type="button" class="danger" id="fDelete">Elimina</button>
        <span class="grow"></span>
        <button type="submit" class="primary">Salva</button>
      </div>
    </form>
  </dialog>

  <dialog id="recDialog">
    <form id="recForm" method="dialog">
      <div class="dlg-head"><h2 id="recTitle">Spesa fissa</h2><button type="button" class="icon-btn" id="recClose" aria-label="Chiudi">✕</button></div>
      <label>Nome <input id="rName" autocomplete="off" placeholder="es. Netflix"></label>
      <div class="row2">
        <label>Importo mensile € <input id="rAmount" inputmode="decimal" autocomplete="off" placeholder="0,00"></label>
        <label>Giorno del mese <input id="rDay" inputmode="numeric" autocomplete="off"></label>
      </div>
      <label>Categoria <select id="rCat"></select></label>
      <label class="check"><input type="checkbox" id="rActive"> Attiva: registrala in automatico ogni mese</label>
      <div class="actions">
        <button type="button" class="danger" id="rDelete">Elimina</button>
        <span class="grow"></span>
        <button type="submit" class="primary">Salva</button>
      </div>
    </form>
  </dialog>

  <dialog id="fundDialog">
    <form id="fundForm" method="dialog">
      <div class="dlg-head"><h2 id="fdTitle">Fondo</h2><button type="button" class="icon-btn" id="fdClose" aria-label="Chiudi">✕</button></div>
      <div class="row-emo">
        <label>Icona <input id="fdEmo" maxlength="4" autocomplete="off"></label>
        <label>Nome <input id="fdName" autocomplete="off" placeholder="es. Viaggio in Giappone"></label>
      </div>
      <div class="row2">
        <label>Obiettivo € <input id="fdTarget" inputmode="decimal" autocomplete="off" placeholder="facoltativo"></label>
        <label>Entro il mese <input id="fdDue" type="month"></label>
      </div>
      <div class="row2">
        <label>Già messi da parte € <input id="fdAlloc" inputmode="decimal" autocomplete="off" placeholder="0"></label>
        <label>Categoria di spesa <select id="fdCat"></select></label>
      </div>
      <p class="note" style="margin:-4px 0 0">Con obiettivo e mese, l'app calcola quanto mettere da parte ogni mese.</p>
      <div class="actions">
        <button type="button" class="danger" id="fdDelete">Elimina</button>
        <span class="grow"></span>
        <button type="submit" class="primary">Salva</button>
      </div>
    </form>
  </dialog>

  <dialog id="amtDialog">
    <form id="amtForm" method="dialog">
      <div class="dlg-head"><h2 id="amtTitle">Importo</h2><button type="button" class="icon-btn" id="amtClose" aria-label="Chiudi">✕</button></div>
      <p class="note" id="amtHint" style="margin:-6px 0 0"></p>
      <label class="amount"><span>€</span><input id="amtInput" inputmode="decimal" placeholder="0,00" autocomplete="off"></label>
      <label class="check" id="amtCheckWrap"><input type="checkbox" id="amtCheck"> <span id="amtCheckLabel"></span></label>
      <div class="actions"><span class="grow"></span><button type="submit" class="primary">Conferma</button></div>
    </form>
  </dialog>

  <div id="tip" role="tooltip"></div>
  <div id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
